<!doctype html>

<head>
    <meta charset="UTF-8">
    <title>cadastro clientes</title>
</head>

<body>
    <header> 
        <h1><p>ASSOCIAÇÃO DE TRABALHO</p></h1>
    </header>

    <main>
        <form>
            <h2>cadastro de funcionarios</h2>

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>
            title= "Nome Completo">

            <label for="CPF">CPF:</label>
            <input type="number" id="CPF" name="CPF" required
            pattern= "[0-9]{3}\.[0-9]{3}\.[0-9]{3}\-[0-9]{2}" title="000.000.000-00">

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" required
            pattern= "([0-9]{2}\) [0-9]{4,5}\-[0-9]{4}" title="(00) 00000-0000">
            
            <label for="CEP">CEP:</label>
            <input type="number" id="CEP" name="CEP" required
            pattern= "[0-9]{5}\-[0-9]{3}" title="00000-000">
        </form>
    </main>

    <footer>
        <p>Informações de contato ligue para 5555-5555</p>
    </footer>

</body>
</html>
